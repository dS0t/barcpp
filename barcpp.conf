# ==============================================================================
# barcpp configuration file / файл конфигурации barcpp
#
# To apply changes, restart the program / Чтобы применить изменения, перезапустите:
#   pkill barcpp; ./barcpp &
#
# Colors must be in #RRGGBB or 0xRRGGBB format (alpha is always opaque)
# Цвета указываются в формате #RRGGBB или 0xRRGGBB (прозрачность не поддерживается)
# ==============================================================================

# Height of the indicator bar in pixels
# Высота самой полоски-индикатора в пикселях
height = 1

# Gap between segments in pixels
# Отступ между сегментами в пикселях
gap_px = 4

# How many pixels to push regular windows down from the top edge
# На сколько пикселей "отталкивать" окна вниз от верхнего края экрана
push_windows_px = 2

# Left and right margins for the bar (in pixels)
# Отступы слева и справа от всей полоски (в пикселях)
margin_left_px = 4
margin_right_px = 4

# Overall opacity of the bar (0 to 100)
# Начальная прозрачность полоски (от 0 до 100)
opacity_pct = 30

# Target opacity at the end of the segment (for opacity gradient)
# Конечная прозрачность к концу сегмента (от 0 до 100)
opacity_pct_end = 100

# Marker size and gap at the beginning of each segment (in pixels)
# Размер цветного маркера и отступа после него в начале каждого сегмента (в px)
marker_px = 10
marker_gap_px = 1

# ------------------------------------------------------------------------------
# Visual Style (Skins) / Визуальный стиль
# ------------------------------------------------------------------------------
# Available skins / Доступные стили:
#   classic  - Solid fill with color thresholds / Сплошная заливка
#   zebra    - Dashed line (cyberpunk style) / Пунктирная линия
#   gradient - Smooth color transition / Плавный градиент от зеленого к красному
#   blocks   - 10 discrete blocks like retro UI / 10 раздельных блоков
skin = zebra

# Settings for 'zebra' skin / Настройки для стиля zebra
zebra_dash_px = 10
zebra_space_px = 1

# Settings for 'blocks' skin / Настройки для стиля blocks
blocks_count = 10

# Global drawing cycle: how often the bar wakes up to check timers (milliseconds)
# Глобальный цикл отрисовки: как часто программа просыпается (в миллисекундах)
poll_ms = 2000

# ------------------------------------------------------------------------------
# Visibility / Включение и отключение сегментов
# 1 = enabled (включено), 0 = disabled (выключено)
# ------------------------------------------------------------------------------
enable_cpu = 1
enable_temp = 1
enable_ram = 1
enable_wifi = 1
enable_bat = 1

# ------------------------------------------------------------------------------
# Polling intervals / Интервалы опроса (в миллисекундах)
# Higher values save CPU / Большие значения экономят процессорное время
# ------------------------------------------------------------------------------
interval_cpu_ms = 1000
interval_temp_ms = 5000
interval_ram_ms = 2000
interval_wifi_ms = 5000
interval_bat_ms = 10000

# ------------------------------------------------------------------------------
# Thresholds / Пороги срабатывания
# ------------------------------------------------------------------------------
# CPU and RAM usage thresholds for changing colors to amber/red (in %)
# Пороги загрузки CPU и RAM для смены цвета на желтый/красный (в %)
cpu_mid_pct = 20
cpu_high_pct = 80
ram_mid_pct = 60
ram_high_pct = 80

# Temperature thresholds for changing colors to amber/red (in Celsius)
# Пороги температуры для смены цвета на желтый/красный (в градусах)
temp_mid_c = 45
temp_high_c = 65

# Maximum expected temperature (used to calculate 100% fill length)
# Максимальная температура (используется для расчета 100% длины полоски)
temp_max_c = 100

# Wi-Fi signal thresholds for changing colors to amber/red (in dBm, e.g. -70)
# Пороги сигнала Wi-Fi для смены цвета (в dBm, например -70)
wifi_mid_dbm = -65
wifi_low_dbm = -75

# Battery low threshold for changing color to red (in %)
# Порог низкого заряда батареи для смены цвета на красный (в %)
bat_low_pct = 20

# ------------------------------------------------------------------------------
# Colors / Цветовая схема (GitHub Dark Theme)
# ------------------------------------------------------------------------------
# Background color for empty parts of segments and gaps
# Цвет фона для пустых частей сегментов и отступов
color_bg = #161b22

# CPU colors: base marker, warning, critical
# Цвета CPU: базовый маркер, предупреждение, критический
color_cpu = #2ea043
color_cpu_mid = #d29922
color_cpu_high = #f85149

# Temp colors: base marker, warning, critical
# Цвета температуры: базовый, предупреждение, критический
color_temp = #39c5cf
color_temp_mid = #d29922
color_temp_high = #f85149

# RAM colors: Used memory, Cached (Reclaimable), warning, critical
# Цвета RAM: Занятая память (Used), Кэш (Cache), предупреждение, критический
color_ram_free = #58a6ff
color_ram_avail = #1f6feb
color_ram_mid = #d29922
color_ram_high = #f85149

# Wi-Fi colors: Good signal, warning, critical
# Цвета Wi-Fi: Хороший сигнал, предупреждение, критический
color_wifi = #cba6f7
color_wifi_mid = #d29922
color_wifi_low = #f85149

# Battery colors: Normal charge, low charge
# Цвета батареи: Нормальный заряд, низкий заряд
color_bat = #f778ba
color_bat_low = #f85149

# ------------------------------------------------------------------------------
# Hardware Paths (Optional) / Пути к системным датчикам (опционально)
# ------------------------------------------------------------------------------
# Uncomment and change if your hardware uses non-standard paths.
# Раскомментируйте и измените, если на вашем железе используются нестандартные пути.
#
# bat_path = /sys/class/power_supply/macsmc-battery/capacity
# temp_path = /sys/class/hwmon/hwmon2/temp1_input
