# ==============================================================================
# barcpp configuration file / файл конфигурации barcpp
#
# To apply changes, reload the config (no restart needed) / Чтобы применить изменения, перечитайте конфиг (перезапуск не нужен):
#   pkill -HUP barcpp
#
# Colors must be in #RRGGBB or 0xRRGGBB format (alpha is always opaque)
# Цвета указываются в формате #RRGGBB или 0xRRGGBB (прозрачность не поддерживается)
# ==============================================================================

# Height of the indicator bar in pixels
# Высота самой полоски-индикатора в пикселях
height = 1

# Gap between segments in pixels
# Отступ между сегментами в пикселях
gap_px = 4

# How many pixels to push regular windows down from the top edge
# На сколько пикселей "отталкивать" окна вниз от верхнего края экрана
push_windows_px = 2

# Left and right margins for the bar (in pixels)
# Отступы слева и справа от всей полоски (в пикселях)
margin_left_px = 4
margin_right_px = 4

# Overall opacity of the bar (0 to 100)
# Начальная прозрачность полоски (от 0 до 100)
opacity_pct = 50

# Target opacity at the end of the segment (for opacity gradient)
# Конечная прозрачность к концу сегмента (от 0 до 100)
opacity_pct_end = 100

# Marker size and gap at the beginning of each segment (in pixels)
# Размер цветного маркера и отступа после него в начале каждого сегмента (в px)
marker_px = 10
marker_gap_px = 1

# ------------------------------------------------------------------------------
# Visual Style (Skins) / Визуальный стиль
# ------------------------------------------------------------------------------
# Available skins / Доступные стили:
#   classic  - Solid fill with color thresholds / Сплошная заливка
#   zebra    - Dashed line (cyberpunk style) / Пунктирная линия
#   gradient - Smooth color transition / Плавный градиент от зеленого к красному
#   blocks   - 10 discrete blocks like retro UI / 10 раздельных блоков
skin = zebra

# Settings for 'zebra' skin / Настройки для стиля zebra
zebra_dash_px = 10
zebra_space_px = 1

# Settings for 'blocks' skin / Настройки для стиля blocks
blocks_count = 10

# Global drawing cycle: how often the bar wakes up to check timers (milliseconds)
# Глобальный цикл отрисовки: как часто программа просыпается (в миллисекундах)
poll_ms = 2000

# ------------------------------------------------------------------------------
# Blink / Мигание маркера
# 1 = enabled (включено), 0 = disabled (выключено)
# ------------------------------------------------------------------------------
# When a segment reaches warning/critical state, its leading marker blinks.
# Warning blinks slowly: its phase flips once per poll_ms (no extra redraws).
# Critical blinks fast, temporarily speeding up the redraw to blink_fast_poll_ms.
# Когда сегмент достигает состояния предупреждения/критического, его маркер мигает.
# Warning мигает медленно: фаза меняется раз в poll_ms (без лишних перерисовок).
# Critical мигает быстро, временно ускоряя цикл до blink_fast_poll_ms.
enable_blink = 1

# Blink half-period for critical state in ms
# Период полуволны мигания для критического состояния в мс
blink_crit_period_ms = 300

# Redraw cycle used while any segment is critical (in ms)
# Цикл отрисовки, пока какой-либо сегмент в критическом состоянии (в мс)
blink_fast_poll_ms = 150

# ------------------------------------------------------------------------------
# Visibility / Включение и отключение сегментов
# 1 = enabled (включено), 0 = disabled (выключено)
# ------------------------------------------------------------------------------
enable_cpu = 1
enable_temp = 1
enable_ram = 1
enable_wifi = 1
enable_disk = 1
enable_bat = 1
# SWAP segment: swap usage (hidden automatically when there is no swap)
# Сегмент SWAP: заполненность swap (скрывается автоматически, если swap нет)
enable_swap = 1
# Memory pressure (PSI) raises the RAM and SWAP markers; needs /proc/pressure/memory
# Давление памяти (PSI) поднимает маркеры RAM и SWAP; нужен /proc/pressure/memory
enable_psi = 1

# ------------------------------------------------------------------------------
# Polling intervals / Интервалы опроса (в миллисекундах)
# Higher values save CPU / Большие значения экономят процессорное время
# ------------------------------------------------------------------------------
interval_cpu_ms = 1000
interval_temp_ms = 5000
interval_ram_ms = 2000
interval_wifi_ms = 5000
interval_disk_ms = 15000
interval_bat_ms = 10000
interval_psi_ms = 2000

# ------------------------------------------------------------------------------
# Thresholds / Пороги срабатывания
# ------------------------------------------------------------------------------
# CPU and RAM usage thresholds for changing colors to amber/red (in %)
# Пороги загрузки CPU и RAM для смены цвета на желтый/красный (в %)
cpu_mid_pct = 20
cpu_high_pct = 80
ram_mid_pct = 60
ram_high_pct = 80

# Temperature thresholds for changing colors to amber/red (in Celsius)
# Пороги температуры для смены цвета на желтый/красный (в градусах)
temp_mid_c = 45
temp_high_c = 65

# Maximum expected temperature (used to calculate 100% fill length)
# Максимальная температура (используется для расчета 100% длины полоски)
temp_max_c = 100

# Wi-Fi signal thresholds for changing colors to amber/red (in dBm, e.g. -70)
# Пороги сигнала Wi-Fi для смены цвета (в dBm, например -70)
wifi_mid_dbm = -70
wifi_low_dbm = -80

# Disk usage thresholds for changing colors to amber/red (in %)
# Пороги занятости диска для смены цвета (в %)
disk_mid_pct = 60
disk_high_pct = 80

# Swap usage thresholds for changing colors to amber/red (in %)
# Пороги заполненности swap для смены цвета на желтый/красный (в %)
swap_mid_pct = 25
swap_high_pct = 60

# Memory pressure (PSI "some avg10", in % of time stalled) thresholds for amber/red
# Пороги давления памяти (PSI "some avg10", % времени простоя) для желтого/красного
psi_mid_pct = 5
psi_high_pct = 20

# PSI overlay: a bar of the PSI value drawn on top of the SWAP fill (0..psi_high_pct = 0..100% of the segment).
# 1 = enabled, 0 = disabled (the markers still show PSI).
# Наложение PSI: полоска значения PSI поверх заливки SWAP (0..psi_high_pct = 0..100% сегмента).
# 1 = включено, 0 = выключено (маркеры всё равно показывают PSI).
psi_overlay = 1

# Battery thresholds (in %): below bat_mid_pct the marker is amber (warning, slow blink),
# below bat_low_pct it is red (critical, fast blink). Not applied while charging.
# Пороги батареи (в %): ниже bat_mid_pct маркер жёлтый (предупреждение, медленное мигание),
# ниже bat_low_pct красный (критический, быстрое мигание). Не применяются при зарядке.
bat_mid_pct = 30
bat_low_pct = 10

# ------------------------------------------------------------------------------
# Colors / Цветовая схема (GitHub Dark Theme)
# ------------------------------------------------------------------------------
# Background color for empty parts of segments and gaps
# Цвет фона для пустых частей сегментов и отступов
color_bg = #161b22

# CPU colors: base marker, warning, critical
# Цвета CPU: базовый маркер, предупреждение, критический
color_cpu = #2ea043
color_cpu_mid = #d29922
color_cpu_high = #f85149

# Temp colors: base marker, warning, critical
# Цвета температуры: базовый, предупреждение, критический
color_temp = #39c5cf
color_temp_mid = #d29922
color_temp_high = #f85149

# RAM colors: Used memory, Cached (Reclaimable), warning, critical
# Цвета RAM: Занятая память (Used), Кэш (Cache), предупреждение, критический
color_ram_free = #58a6ff
color_ram_avail = #1f6feb
color_ram_mid = #d29922
color_ram_high = #f85149

# Wi-Fi colors: Good signal, warning, critical
# Цвета Wi-Fi: Хороший сигнал, предупреждение, критический
color_wifi = #cba6f7
color_wifi_mid = #d29922
color_wifi_low = #f85149

# Disk colors: normal, warning, critical
# Цвета диска: базовый, предупреждение, критический
color_disk = #f0d64b
color_disk_mid = #d29922
color_disk_high = #f85149

# Swap colors: base, warning, critical
# Цвета swap: базовый, предупреждение, критический
color_swap = #bc8cff
color_swap_mid = #d29922
color_swap_high = #f85149

# PSI overlay color (drawn on top of the SWAP bar)
# Цвет полоски PSI (поверх заливки SWAP)
color_psi = #ffa657

# Battery colors: normal, idle (grey: AC adapter connected but battery not charging),
# warning, critical. While charging the marker blinks green (color_bat_charging).
# Цвета батареи: обычный, idle (серый: блок питания подключён, но батарея не заряжается),
# предупреждение, критический. При зарядке маркер мигает зелёным (color_bat_charging).
color_bat = #f778ba
color_bat_idle = #8b949e
color_bat_mid = #d29922
color_bat_low = #f85149
color_bat_charging = #2ea043

# ------------------------------------------------------------------------------
# Hardware Paths (Optional) / Пути к системным датчикам (опционально)
# ------------------------------------------------------------------------------
# Uncomment and change if your hardware uses non-standard paths.
# Раскомментируйте и измените, если на вашем железе используются нестандартные пути.
#
# bat_path = /sys/class/power_supply/macsmc-battery/capacity
# temp_path = /sys/class/hwmon/hwmon2/temp1_input
# disk_path = /
