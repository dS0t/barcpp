<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%" height="120">
  <rect width="1000" height="120" fill="#0d1117" rx="4"/>

  <!-- Segment 1: CPU 45% (amber warning marker + green fill) -->
  <rect x="4"   y="0" width="138" height="2" fill="#161b22"/>
  <rect x="4"   y="0" width="10"  height="2" fill="#d29922"/>
  <rect x="14"  y="0" width="52"  height="2" fill="#2ea043"/>

  <!-- Segment 2: TEMP 55C (amber warning marker + cyan fill) -->
  <rect x="146" y="0" width="138" height="2" fill="#161b22"/>
  <rect x="146" y="0" width="10"  height="2" fill="#d29922"/>
  <rect x="156" y="0" width="66"  height="2" fill="#39c5cf"/>

  <!-- Segment 3: RAM Used + Cache (normal blue marker + blue fill + dark cache) -->
  <rect x="288" y="0" width="138" height="2" fill="#161b22"/>
  <rect x="288" y="0" width="10"  height="2" fill="#58a6ff"/>
  <rect x="298" y="0" width="45"  height="2" fill="#58a6ff"/>
  <rect x="343" y="0" width="28"  height="2" fill="#1f6feb"/>

  <!-- Segment 4: SWAP 20% with PSI overlay 15% (normal purple marker, orange PSI bar on top of purple fill) -->
  <rect x="430" y="0" width="138" height="2" fill="#161b22"/>
  <rect x="430" y="0" width="10"  height="2" fill="#bc8cff"/>
  <rect x="440" y="0" width="10"  height="2" fill="#ffa657"/>
  <rect x="450" y="0" width="8"   height="2" fill="#bc8cff"/>

  <!-- Segment 5: WIFI (normal purple marker + purple fill) -->
  <rect x="572" y="0" width="138" height="2" fill="#161b22"/>
  <rect x="572" y="0" width="10"  height="2" fill="#cba6f7"/>
  <rect x="582" y="0" width="92"  height="2" fill="#cba6f7"/>

  <!-- Segment 6: DISK 44% (normal yellow marker + yellow fill) -->
  <rect x="714" y="0" width="138" height="2" fill="#161b22"/>
  <rect x="714" y="0" width="10"  height="2" fill="#f0d64b"/>
  <rect x="724" y="0" width="51"  height="2" fill="#f0d64b"/>

  <!-- Segment 7: BAT 15% (warning amber marker + pink fill, discharging) -->
  <rect x="856" y="0" width="140" height="2" fill="#161b22"/>
  <rect x="856" y="0" width="10"  height="2" fill="#d29922"/>
  <rect x="866" y="0" width="11"  height="2" fill="#f778ba"/>

  <g fill="#8b949e" font-family="sans-serif" text-anchor="middle">
    <path d="M 73 4 L 73 25"   stroke="#30363d" stroke-width="1"/>
    <text x="73"  y="40" font-size="11" fill="#c9d1d9">CPU 45%</text>
    <text x="73"  y="54" font-size="9">amber marker</text>

    <path d="M 215 4 L 215 25" stroke="#30363d" stroke-width="1"/>
    <text x="215" y="40" font-size="11" fill="#c9d1d9">TEMP 55°C</text>
    <text x="215" y="54" font-size="9">amber marker</text>

    <path d="M 357 4 L 357 25" stroke="#30363d" stroke-width="1"/>
    <text x="357" y="40" font-size="11" fill="#c9d1d9">RAM</text>
    <text x="357" y="54" font-size="9">used + cache</text>

    <path d="M 499 4 L 499 25" stroke="#30363d" stroke-width="1"/>
    <text x="499" y="40" font-size="11" fill="#c9d1d9">SWAP 20% · PSI 3%</text>
    <text x="499" y="54" font-size="9">orange = PSI overlay</text>

    <path d="M 641 4 L 641 25" stroke="#30363d" stroke-width="1"/>
    <text x="641" y="40" font-size="11" fill="#c9d1d9">Wi-Fi</text>
    <text x="641" y="54" font-size="9">normal</text>

    <path d="M 783 4 L 783 25" stroke="#30363d" stroke-width="1"/>
    <text x="783" y="40" font-size="11" fill="#c9d1d9">DISK 44%</text>
    <text x="783" y="54" font-size="9">normal</text>

    <path d="M 926 4 L 926 25" stroke="#30363d" stroke-width="1"/>
    <text x="926" y="40" font-size="11" fill="#c9d1d9">BAT 15%</text>
    <text x="926" y="54" font-size="9">warning (amber)</text>
  </g>

  <text x="500" y="80" fill="#8b949e" font-family="monospace" font-size="14" text-anchor="middle">barcpp - 1px Wayland Load Strip (Actual scale height representation)</text>
</svg>
